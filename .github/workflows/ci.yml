name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Placeholder env vars for build/typecheck only — no real secrets needed here.
# `prisma generate` reads DATABASE_URL from prisma.config.ts but only to know
# the shape of the connection, not to actually connect; a well-formed but
# fake URL is enough. Real deploy secrets (Vercel, etc.) are separate from
# this file and are never read from here.
env:
  DATABASE_URL: "postgresql://user:password@localhost:5432/ci_placeholder"
  NEXT_PUBLIC_SUPABASE_URL: "https://ci-placeholder.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  # Runs against a REAL Postgres, with real migrations applied and the real
  # generated Prisma client — no mocks. This is what actually proves things
  # like "two concurrent webhook deliveries can't double-credit a wallet"
  # or "the rate limiter holds under real concurrency" — a mocked unit test
  # can only prove the code *calls* the right function, never that the
  # database *enforces* the guarantee.
  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_integration"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stub the Supabase auth schema
        # The enable_row_level_security migration references auth.uid() in
        # a SECURITY DEFINER function body — Postgres parses and validates
        # LANGUAGE sql function bodies at CREATE FUNCTION time (unlike
        # plpgsql, which mostly defers to invocation), so auth.uid() has to
        # actually exist for the migration to apply at all, even though
        # nothing in these tests calls it meaningfully.
        #
        # auth.uid() only exists on real Supabase, created by their Auth
        # service's own migrations — not something the plain postgres:16
        # image here has, and running the full Supabase stack just for
        # this would mean Docker-in-Docker for no real benefit: this app's
        # own DATABASE_URL connection already bypasses RLS the same way
        # the service role does (RLS here is defense-in-depth, not the
        # enforcement boundary — see the enable_row_level_security
        # migration's own comments), so these tests were never exercising
        # real RLS/auth.uid() behavior anyway. Actual RLS behavior against
        # a real anon/authenticated connection is validated separately by
        # the verify-rls script against the real Supabase project — this
        # stub only needs to be enough for the migration to *apply*.
        run: |
          psql "$DATABASE_URL" -c "
            CREATE SCHEMA IF NOT EXISTS auth;
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS \$\$ SELECT NULL::uuid \$\$;
          "
      - name: Apply real migrations to the test database
        run: npx prisma migrate deploy
      - run: npm run test:integration

  # Fails the build if schema.prisma has changes not captured by a real
  # migration file — e.g. someone edited the schema and forgot to run
  # `prisma migrate dev`. Safe to run now: the baseline migration is a real
  # snapshot of production (fixed as part of adopting this CI), not the
  # empty placeholder it started as.
  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - name: Stub the Supabase auth schema in the shadow database
        # Same reasoning as the integration-test job: migrate diff replays
        # every migration (including enable_row_level_security, which
        # references auth.uid()) into the shadow database to compute the
        # diff, so it needs the same stub.
        env:
          SHADOW_DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_shadow"
        run: |
          psql "$SHADOW_DATABASE_URL" -c "
            CREATE SCHEMA IF NOT EXISTS auth;
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS \$\$ SELECT NULL::uuid \$\$;
          "
      - name: Check for schema drift not captured by a migration
        env:
          SHADOW_DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_shadow"
        run: |
          npx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema ./prisma/schema.prisma \
            --exit-code || \
          (echo "::error::schema.prisma has changes not captured in prisma/migrations — run 'npx prisma migrate dev' and commit the result." && exit 1)

  # Applies pending migrations to production right after a push to main
  # passes every check above. Prevents code that depends on a schema
  # change from ever being live before the schema change itself is.
  # Requires a GitHub Actions secret named PRODUCTION_DATABASE_URL,
  # set to the SAME connection string used for `npx prisma migrate deploy`
  # locally (the direct/session connection on port 5432, not the pgbouncer
  # pooler on 6543 — migrate deploy needs an advisory lock that
  # transaction-pooling mode doesn't support).
  deploy-migrations:
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test
      - build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy pending migrations to production
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx prisma migrate deploy
