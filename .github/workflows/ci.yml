name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fast checks that need no database — these run on every push/PR and
  # should stay green in well under a minute. If this job fails, nothing
  # else runs; there's no point spinning up Postgres for a build that
  # doesn't even typecheck.
  lint-typecheck-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Integration tests prove things a mocked-Prisma unit test can't — e.g.
  # that two concurrent webhook deliveries with the same paymentReference
  # can never both insert. They need a real, disposable Postgres database,
  # never production (see vitest.integration.config.ts and the README's
  # Testing section for why these tests deliberately don't load .env).
  integration:
    runs-on: ubuntu-latest
    needs: lint-typecheck-unit

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # A plain GitHub Actions Postgres service has no Supabase `auth`
      # schema — the RLS migration's helper functions call auth.uid(),
      # so applying it here fails with "schema auth does not exist"
      # unless something provides that schema first. See the "Stub the
      # auth schema" step below for how this is bridged, and the README's
      # Database section for the same failure mode showing up locally
      # via `migrate dev`'s shadow database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Minimal stand-in for the parts of Supabase's auth schema this
      # project's migrations reference. This is NOT a reimplementation of
      # Supabase Auth — it's just enough for CREATE FUNCTION statements
      # that call auth.uid() to resolve at migration-apply time. The
      # integration tests never rely on real authentication; they call
      # checkRateLimit()/prisma.* directly, so a stub uid() (always NULL)
      # is sufficient.
      - name: Stub Supabase auth schema
        run: |
          psql "$DATABASE_URL" -c "CREATE SCHEMA IF NOT EXISTS auth;"
          psql "$DATABASE_URL" -c "CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS \$\$ SELECT NULL::uuid \$\$;"

      - run: npx prisma migrate deploy

      - run: npm run test:integration
