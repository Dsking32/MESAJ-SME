name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: "postgresql://user:password@localhost:5432/ci_placeholder"
  NEXT_PUBLIC_SUPABASE_URL: "https://ci-placeholder.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test:coverage

  build:
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

  integration-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_integration"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Stub Supabase auth schema (auth.uid())
        run: |
          PGPASSWORD=ci psql -h localhost -U ci -d ci_integration <<'SQL'
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
          LANGUAGE sql STABLE AS $$ SELECT NULL::uuid; $$;
          SQL

      - name: Apply real migrations to the test database
        run: npx prisma migrate deploy

      - run: npm run test:integration

  # Fails the build if schema.prisma has changes not captured by a real
  # migration file — e.g. someone edited the schema and forgot to run
  # `prisma migrate dev`. Safe to run now: the baseline migration is a real
  # snapshot of production (fixed as part of adopting this CI), not the
  # empty placeholder it started as.
  migration-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Stub Supabase auth schema (auth.uid())
        run: |
          PGPASSWORD=ci psql -h localhost -U ci -d ci_shadow <<'SQL'
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
          LANGUAGE sql STABLE AS $$ SELECT NULL::uuid; $$;
          SQL

      - run: npx prisma validate

      - name: Check for schema drift not captured by a migration
        env:
          # Prisma 7 removed --shadow-database-url as a CLI flag on
          # `migrate diff`; the shadow DB is now read from
          # prisma.config.ts's datasource.shadowDatabaseUrl, which in turn
          # reads this env var.
          SHADOW_DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_shadow"
        run: |
          npx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema ./prisma/schema.prisma \
            --exit-code || \
          (echo "::error::schema.prisma has changes not captured in prisma/migrations — run 'npx prisma migrate dev' and commit the result." && exit 1)

  # Applies pending migrations to production right after a push to main
  # passes every check above. Prevents code that depends on a schema
  # change from ever being live before the schema change itself is.
  # Requires a GitHub Actions secret named PRODUCTION_DATABASE_URL,
  # set to the SAME connection string used for `npx prisma migrate deploy`
  # locally (the direct/session connection on port 5432, not the pgbouncer
  # pooler on 6543 — migrate deploy needs an advisory lock that
  # transaction-pooling mode doesn't support).
  deploy-migrations:
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test
      - build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy pending migrations to production
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx prisma migrate deploy